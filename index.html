<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPISI Maps - Ruteo Algorítmico</title>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos Locales -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Mapa en pantalla completa -->
      <div id="map"></div>

      <!-- Tarjeta Flotante Superior (Estilo Google Maps) -->
      <div class="gmaps-card">
        <header class="gmaps-header">
          <div class="gmaps-brand">
            <span class="g-blue">E</span><span class="g-red">P</span><span class="g-yellow">I</span><span class="g-blue">S</span><span class="g-green">I</span>
            <span class="brand-sub">Maps Algoritmos</span>
          </div>
          <span class="course-badge">Proyecto III Ciclo</span>
        </header>

        <form id="route-form">
          <div class="route-inputs-container">
            <!-- Conector visual de Origen (Punto A) a Destino (Punto B) -->
            <div class="route-connector">
              <div class="dot-origin"></div>
              <div class="connector-line"></div>
              <div class="dot-target"></div>
            </div>

            <div class="inputs-stack">
              <div class="form-group autocomplete-wrapper">
                <input type="text" id="input-start" placeholder="Elegir punto de partida..." autocomplete="off" required />
                <button type="button" id="btn-use-location" class="btn-use-location" aria-label="Usar mi ubicación actual" title="Usar mi ubicación">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                </button>
                <ul id="suggestions-start" class="suggestions-list"></ul>
              </div>

              <div class="form-group autocomplete-wrapper">
                <input type="text" id="input-target" placeholder="Elegir destino..." autocomplete="off" required />
                <ul id="suggestions-target" class="suggestions-list"></ul>
              </div>
            </div>
          </div>

          <!-- Selector de Algoritmo mediante Píldoras / Chips -->
          <div class="algo-chips">
            <label class="chip">
              <input type="radio" name="select-algo" value="ASTAR" checked />
              <span>A* (Óptimo)</span>
            </label>
            <label class="chip">
              <input type="radio" name="select-algo" value="GREEDY" />
              <span>Voraz / Greedy</span>
            </label>
            <label class="chip">
              <input type="radio" name="select-algo" value="DIJKSTRA" />
              <span>Dijkstra</span>
            </label>
          </div>

          <button type="submit" id="btn-search" class="btn-gmaps">
            <svg class="gmaps-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M21.71 11.29l-9-9c-.39-.39-1.02-.39-1.41 0l-9 9c-.39.39-.39 1.02 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9c.39-.38.39-1.01 0-1.41zM14 14.5V12h-4v3H8.5v-4.5c0-.55.45-1 1-1H14V7l4 3.75-4 3.75z"/>
            </svg>
            Cómo llegar
          </button>
        </form>
      </div>

      <!-- Tarjeta Flotante Inferior de Telemetría + Botón de Navegación -->
      <div class="telemetry-card">
        <div class="telemetry-header">
          <span class="status-dot"></span>
          <span id="metric-eta">Ruta Recomendada</span>
        </div>
        <div class="metrics-row">
          <div class="metric-item">
            <span class="metric-label">Distancia</span>
            <strong id="metric-distance" class="metric-val">0.00 km</strong>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Tiempo CPU</span>
            <strong id="metric-time" class="metric-val">0.00 ms</strong>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <span class="metric-label">Nodos</span>
            <strong id="metric-nodes" class="metric-val">0</strong>
          </div>
        </div>

        <div id="live-status" class="live-status" hidden>
          <span class="live-dot"></span>
          <span id="live-text"></span>
        </div>

        <button type="button" id="btn-start-nav" class="btn-start-nav" disabled>
          ▶ Iniciar Caminata
        </button>
      </div>

      <!-- Botón de ubicación en tiempo real -->
      <button type="button" id="btn-locate" class="locate-fab" data-state="off" aria-pressed="false" aria-label="Mostrar mi ubicación" title="Mostrar mi ubicación">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2" class="fab-core"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>

      <!-- Avisos -->
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
